<div class="tab-content" id="add-doctor">

    <div class="form-card">
        <div class="form-card-head">
            <h3>Doctor Registration</h3>
            <p>Create a specialist profile and issue their portal login credentials.</p>
        </div>

        <form onsubmit="event.preventDefault(); submitDoctor();" class="form-card-body">
            <div class="field">
                <label for="regDocId">Doctor ID</label>
                <input type="text" id="regDocId" placeholder="e.g. DOC-101">
            </div>

            <div class="field">
                <label for="regDocName">Full Name *</label>
                <input type="text" id="regDocName" placeholder="Dr. Firstname Lastname" required>
            </div>

            <div class="field">
                <label for="regDocLocation">Branch / Location</label>
                <input type="text" id="regDocLocation" placeholder="e.g. Colombo 03 Branch">
            </div>

            <div class="field">
                <label for="regDocTel">Contact Number</label>
                <input type="text" id="regDocTel" placeholder="10 digit contact number">
            </div>

            <div class="field">
                <label for="regDocUsername">Portal Username</label>
                <input type="text" id="regDocUsername" placeholder="e.g. doc.kasun">
            </div>

            <div class="field">
                <label for="regDocPassword">Temporary Password</label>
                <input type="password" id="regDocPassword" placeholder="Create a temporary password">
            </div>

            <button type="submit" class="btn-primary-flat">Register Doctor</button>
        </form>
    </div>

    <div class="data-panel">
        <div class="data-panel-head">
            <div>
                <h3>Doctor Directory</h3>
                <p>All specialists currently registered on the platform.</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchDocInput" placeholder="Search doctors" onkeyup="filterTable('docTable', 'searchDocInput')">
            </div>
        </div>

        <div class="data-panel-table-wrap">
            <table id="docTable">
                <thead>
                    <tr>
                        <th>Doctor ID</th>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>Contact</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="docTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading doctors...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Doctor Drawer -->
<div id="editDoctorModal" class="drawer-overlay">
    <div class="drawer-panel">
        <div class="drawer-header">
            <div>
                <span class="drawer-eyebrow">Specialist Record</span>
                <h3><i class="fa-solid fa-user-pen"></i> Edit Doctor Details</h3>
            </div>
            <button type="button" class="drawer-close" onclick="closeEditDocModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form onsubmit="handleUpdateDoctor(event)" class="drawer-body">
            <input type="hidden" id="editDocId">

            <div class="input-group">
                <label>Doctor Full Name *</label>
                <input type="text" id="editDocName" required>
            </div>

            <div class="input-group">
                <label>Location / Operating Branch</label>
                <input type="text" id="editDocLocation">
            </div>

            <div class="input-group">
                <label>Telephone Contact</label>
                <input type="text" id="editDocTel">
            </div>

            <div class="drawer-footer">
                <button type="button" class="btn-cancel" onclick="closeEditDocModal()">Cancel</button>
                <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> Save Changes</button>
            </div>
        </form>
    </div>
</div>
