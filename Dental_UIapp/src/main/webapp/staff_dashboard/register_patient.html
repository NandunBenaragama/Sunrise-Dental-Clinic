<div class="tab-content" id="register-patient">

    <div class="form-card">
        <div class="form-card-head">
            <h3>Patient Registration</h3>
            <p>Add a new patient record to the clinic database.</p>
        </div>

        <form onsubmit="event.preventDefault(); submitPatient();" class="form-card-body">
            <div class="field">
                <label for="patientRegName">Full Name *</label>
                <input type="text" id="patientRegName" placeholder="Enter patient's full name" required>
            </div>

            <div class="field">
                <label for="patientRegAddress">Resident Address</label>
                <input type="text" id="patientRegAddress" placeholder="Enter resident address">
            </div>

            <div class="field">
                <label for="patientRegContact">Contact Number *</label>
                <input type="text" id="patientRegContact" placeholder="10 digit contact number" required>
            </div>

            <button type="submit" class="btn-primary-flat">Register Patient</button>
        </form>
    </div>

    <div class="data-panel">
        <div class="data-panel-head">
            <div>
                <h3>Patient Directory</h3>
                <p>Everyone currently registered as a patient of the clinic.</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchPatInput" placeholder="Search patients" onkeyup="filterTable('patientTable', 'searchPatInput')">
            </div>
        </div>

        <div class="data-panel-table-wrap">
            <table id="patientTable">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Name</th>
                        <th>Address</th>
                        <th>Contact</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading patients...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Patient Drawer -->
<div id="editPatientModal" class="drawer-overlay">
    <div class="drawer-panel">
        <div class="drawer-header">
            <div>
                <span class="drawer-eyebrow">Patient Record</span>
                <h3><i class="fa-solid fa-user-pen"></i> Edit Patient Details</h3>
            </div>
            <button type="button" class="drawer-close" onclick="closeEditPatientModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form onsubmit="handleUpdatePatient(event)" class="drawer-body">
            <input type="hidden" id="editPatId">

            <div class="input-group">
                <label>Patient Full Name *</label>
                <input type="text" id="editPatName" required>
            </div>

            <div class="input-group">
                <label>Resident Address</label>
                <input type="text" id="editPatAddress">
            </div>

            <div class="input-group">
                <label>Contact Phone *</label>
                <input type="text" id="editPatContact" required>
            </div>

            <div class="drawer-footer">
                <button type="button" class="btn-cancel" onclick="closeEditPatientModal()">Cancel</button>
                <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> Save Changes</button>
            </div>
        </form>
    </div>
</div>
