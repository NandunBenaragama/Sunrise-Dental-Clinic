<div class="tab-content" id="register-patient">
    <div class="card">
        <div class="card-header">
            <h3><i class="fa-solid fa-user-plus" style="color:var(--primary);"></i> Register New Patient</h3>
        </div>
        
        <form onsubmit="event.preventDefault(); submitPatient();">
            <div class="form-grid" style="grid-template-columns: repeat(3, 1fr);">
                <div class="input-group">
                    <label>Patient Full Name *</label>
                    <input type="text" id="patientRegName" placeholder="Enter Full Name" required>
                </div>
                <div class="input-group">
                    <label>Resident Address</label>
                    <input type="text" id="patientRegAddress" placeholder="Enter Resident Address">
                </div>
                <div class="input-group">
                    <label>Contact Phone Number (10 Digits) *</label>
                    <input type="text" id="patientRegContact" placeholder="0771234567" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" style="margin-top: 15px;">
                <i class="fa-solid fa-user-check"></i> Register Patient
            </button>
        </form>

        <div class="section-divider" style="margin: 30px 0 20px 0; border-top: 1px solid var(--border);"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h4 style="color: var(--secondary); font-size: 16px; font-weight: 700; margin: 0;">Registered Patients List</h4>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchPatInput" placeholder="Search Patients..." onkeyup="filterTable('patientTable', 'searchPatInput')">
            </div>
        </div>

        <div class="table-responsive">
            <table class="data-table" id="patientTable">
                <thead>
                    <tr>
                        <th>Patient ID</th>
                        <th>Patient Name</th>
                        <th>Address</th>
                        <th>Contact</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="patientTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading patients...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Patient Modal Popup -->
<div id="editPatientModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 99999; justify-content: center; align-items: center;">
    <div style="background: #ffffff; width: 440px; max-width: 90%; padding: 28px; border-radius: 18px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); border: 1px solid #e2e8f0; animation: modalFadeIn 0.3s ease;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
            <h3 style="color: #0f172a; font-size: 18px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-user-pen" style="color: #0284c7;"></i> Edit Patient Details
            </h3>
            <button type="button" onclick="closeEditPatientModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; line-height: 1;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form onsubmit="handleUpdatePatient(event)">
            <input type="hidden" id="editPatId">

            <div class="input-group" style="margin-bottom: 14px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Patient Full Name *</label>
                <input type="text" id="editPatName" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;" required>
            </div>

            <div class="input-group" style="margin-bottom: 14px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Resident Address</label>
                <input type="text" id="editPatAddress" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;">
            </div>

            <div class="input-group" style="margin-bottom: 22px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Contact Phone *</label>
                <input type="text" id="editPatContact" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;" required>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeEditPatientModal()" style="padding: 10px 18px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; font-weight: 600; font-size: 13.5px; cursor: pointer;">
                    Cancel
                </button>
                <button type="submit" style="padding: 10px 20px; border-radius: 10px; border: none; background: #0284c7; color: #ffffff; font-weight: 700; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);">
                    <i class="fa-solid fa-check"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
