<div id="saved-receipts" class="tab-content">

    <div class="data-panel">
        <div class="data-panel-head">
            <div>
                <h3>Receipts &amp; Billing History</h3>
                <p>Every invoice issued across the clinic, ready to reprint.</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchBills" placeholder="Search receipts" onkeyup="filterTable('receiptsTable', 'searchBills')">
            </div>
        </div>

        <div class="data-panel-table-wrap">
        <table id="receiptsTable">
            <thead>
                <tr>
                    <th>Bill ID</th>
                    <th>Appt No.</th>
                    <th>Patient</th>
                    <th>Treatment</th>
                    <th>Consultation</th>
                    <th>Treatment Fee</th>
                    <th>Total</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="billTableBody">
                <tr>
                    <td colspan="8" style="text-align:center;">Loading receipts...</td>
                </tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
