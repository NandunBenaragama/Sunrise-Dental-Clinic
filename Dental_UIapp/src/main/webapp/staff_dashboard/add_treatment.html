<div class="tab-content" id="add-treatment">
    <div class="card">
        <div class="card-header">
            <h3><i class="fa-solid fa-notes-medical" style="color:var(--primary);"></i> Add New Dental Treatment & Procedure</h3>
        </div>
        
        <form onsubmit="event.preventDefault(); submitTreatment();">
            <div class="form-grid" style="grid-template-columns: repeat(2, 1fr);">
                <div class="input-group">
                    <label>Treatment / Procedure Name *</label>
                    <input type="text" id="treatRegName" placeholder="e.g. Tooth Extraction / Root Canal" required>
                </div>
                <div class="input-group">
                    <label>Standard Fee / Cost (LKR) *</label>
                    <input type="number" step="0.01" id="treatRegCost" placeholder="e.g. 5000.00" required>
                </div>
            </div>
            <button type="submit" class="btn-submit" style="margin-top: 15px;">
                <i class="fa-solid fa-floppy-disk"></i> Save Treatment
            </button>
        </form>

        <div class="section-divider" style="margin: 30px 0 20px 0; border-top: 1px solid var(--border);"></div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
            <h4 style="color: var(--secondary); font-size: 16px; font-weight: 700; margin: 0;">Available Treatment Procedures</h4>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchTreatInput" placeholder="Search Treatments..." onkeyup="filterTable('treatTable', 'searchTreatInput')">
            </div>
        </div>

        <div class="table-responsive">
            <table class="data-table" id="treatTable">
                <thead>
                    <tr>
                        <th>Treatment Code</th>
                        <th>Procedure Name</th>
                        <th>Standard Cost</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="treatTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading treatments...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Treatment Modal Popup -->
<div id="editTreatmentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 99999; justify-content: center; align-items: center;">
    <div style="background: #ffffff; width: 440px; max-width: 90%; padding: 28px; border-radius: 18px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); border: 1px solid #e2e8f0; animation: modalFadeIn 0.3s ease;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
            <h3 style="color: #0f172a; font-size: 18px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-pen-to-square" style="color: #0284c7;"></i> Edit Treatment Procedure
            </h3>
            <button type="button" onclick="closeEditTreatmentModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; line-height: 1;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form onsubmit="handleUpdateTreatment(event)">
            <input type="hidden" id="editTreatId">

            <div class="input-group" style="margin-bottom: 14px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Treatment / Procedure Name *</label>
                <input type="text" id="editTreatName" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;" required>
            </div>

            <div class="input-group" style="margin-bottom: 22px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Standard Cost (LKR) *</label>
                <input type="number" step="0.01" id="editTreatCost" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;" required>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeEditTreatmentModal()" style="padding: 10px 18px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; font-weight: 600; font-size: 13.5px; cursor: pointer;">
                    Cancel
                </button>
                <button type="submit" style="padding: 10px 20px; border-radius: 10px; border: none; background: #0284c7; color: #ffffff; font-weight: 700; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);">
                    <i class="fa-solid fa-check"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
