<div class="tab-content" id="add-treatment">

    <div class="form-card">
        <div class="form-card-head">
            <h3>Treatment Setup</h3>
            <p>Define a procedure and its standard fee for booking and billing.</p>
        </div>

        <form onsubmit="event.preventDefault(); submitTreatment();" class="form-card-body">
            <div class="field">
                <label for="treatRegName">Procedure Name *</label>
                <input type="text" id="treatRegName" placeholder="e.g. Tooth Extraction, Root Canal" required>
            </div>

            <div class="field">
                <label for="treatRegCost">Standard Fee (LKR) *</label>
                <input type="number" step="0.01" id="treatRegCost" placeholder="e.g. 5000.00" required>
            </div>

            <button type="submit" class="btn-primary-flat">Save Treatment</button>
        </form>
    </div>

    <div class="data-panel">
        <div class="data-panel-head">
            <div>
                <h3>Treatment Catalogue</h3>
                <p>Procedures available for booking, with their standard cost.</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchTreatInput" placeholder="Search treatments" onkeyup="filterTable('treatTable', 'searchTreatInput')">
            </div>
        </div>

        <div class="data-panel-table-wrap">
            <table id="treatTable">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Procedure</th>
                        <th>Standard Cost</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="treatTableBody">
                    <tr>
                        <td colspan="4" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading treatments...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Treatment Drawer -->
<div id="editTreatmentModal" class="drawer-overlay">
    <div class="drawer-panel">
        <div class="drawer-header">
            <div>
                <span class="drawer-eyebrow">Treatment Record</span>
                <h3><i class="fa-solid fa-pen-to-square"></i> Edit Treatment Procedure</h3>
            </div>
            <button type="button" class="drawer-close" onclick="closeEditTreatmentModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form onsubmit="handleUpdateTreatment(event)" class="drawer-body">
            <input type="hidden" id="editTreatId">

            <div class="input-group">
                <label>Treatment / Procedure Name *</label>
                <input type="text" id="editTreatName" required>
            </div>

            <div class="input-group">
                <label>Standard Cost (LKR) *</label>
                <input type="number" step="0.01" id="editTreatCost" required>
            </div>

            <div class="drawer-footer">
                <button type="button" class="btn-cancel" onclick="closeEditTreatmentModal()">Cancel</button>
                <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> Save Changes</button>
            </div>
        </form>
    </div>
</div>
