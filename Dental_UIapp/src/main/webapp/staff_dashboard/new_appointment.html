<div id="add-appointment" class="tab-content">
    <div class="card-header">
        <div class="card-title">
            <i class="fa-solid fa-calendar-plus"></i> Register Patient Appointment
        </div>
    </div>

    <form id="appointmentForm" onsubmit="event.preventDefault(); submitAppointment();">
        <div class="form-grid" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px;">
            
            <!-- Select from Registered Patients -->
            <div class="form-group" style="grid-column: 1 / -1;">
                <label style="font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">
                    <i class="fa-solid fa-user-check" style="color:var(--primary);"></i> Select Registered Patient (Auto-Fills Details):
                </label>
                <select id="patientSelectDropdown" onchange="onPatientSelected(this.value)">
                    <option value="">-- Choose Existing Patient --</option>
                </select>
            </div>

            <div class="form-group">
                <label style="font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Patient Full Name *</label>
                <input type="text" id="apptPatientName" placeholder="Enter Full Name" required>
            </div>

            <div class="form-group">
                <label style="font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Address</label>
                <input type="text" id="apptAddress" placeholder="Enter Resident Address">
            </div>

            <div class="form-group">
                <label style="font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Contact Phone Number (10 Digits) *</label>
                <input type="text" id="apptContact" placeholder="0771234567" required>
            </div>

            <div class="form-group">
                <label style="font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Assigned Dentist *</label>
                <select id="dentistDropdown" required>
                    <option value="">-- Select Dentist --</option>
                </select>
            </div>

            <div class="form-group">
                <label style="font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Treatment Type *</label>
                <select id="treatmentDropdown" required>
                    <option value="">-- Select Treatment --</option>
                </select>
            </div>

            <div class="form-group">
                <label style="font-weight: 600; color: var(--secondary); margin-bottom: 5px; display: block;">Appointment Schedule Date & Time *</label>
                <input type="datetime-local" id="apptDateTime" required>
            </div>
        </div>

        <button type="submit" class="btn-submit" style="margin-top: 20px;">
            <i class="fa-solid fa-calendar-check"></i> Save & Confirm Appointment
        </button>
    </form>
</div>
