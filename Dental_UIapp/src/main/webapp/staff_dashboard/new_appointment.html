<div id="add-appointment" class="tab-content">

    <div class="form-card">
        <div class="form-card-head">
            <h3>New Booking</h3>
            <p>Schedule an appointment for a new or existing patient.</p>
        </div>

        <form id="appointmentForm" onsubmit="event.preventDefault(); submitAppointment();" class="form-card-body">

            <!-- Select from Registered Patients -->
            <div class="assist-card">
                <label for="patientSelectDropdown">Look up an existing patient (autofills their details)</label>
                <select id="patientSelectDropdown" onchange="onPatientSelected(this.value)">
                    <option value="">-- Choose Existing Patient --</option>
                </select>
            </div>

            <div class="field">
                <label for="apptPatientName">Patient Full Name *</label>
                <input type="text" id="apptPatientName" placeholder="Enter full name" required>
            </div>

            <div class="field">
                <label for="apptAddress">Address</label>
                <input type="text" id="apptAddress" placeholder="Enter resident address">
            </div>

            <div class="field">
                <label for="apptContact">Contact Number *</label>
                <input type="text" id="apptContact" placeholder="10 digit contact number" required>
            </div>

            <div class="field">
                <label for="dentistDropdown">Assigned Dentist *</label>
                <select id="dentistDropdown" required>
                    <option value="">-- Select Dentist --</option>
                </select>
            </div>

            <div class="field">
                <label for="treatmentDropdown">Treatment Type *</label>
                <select id="treatmentDropdown" required>
                    <option value="">-- Select Treatment --</option>
                </select>
            </div>

            <div class="field">
                <label for="apptDateTime">Appointment Date &amp; Time *</label>
                <input type="datetime-local" id="apptDateTime" required>
            </div>

            <button type="submit" class="btn-primary-flat">Save &amp; Confirm Appointment</button>
        </form>
    </div>
</div>
