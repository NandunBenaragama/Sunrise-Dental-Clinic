<div class="tab-content" id="staff-profile">

    <div class="profile-layout">
        <div class="profile-identity">
            <div class="profile-avatar"><i class="fa-solid fa-user-tie"></i></div>
            <h4 id="profDisplayTitle">Saman Perera</h4>
            <span id="profRoleBadge" class="badge badge-done">Receptionist</span>
        </div>

        <div class="profile-settings">
            <form onsubmit="handleUpdateStaffProfile(event)" class="form-card-body">
                <div class="form-card-head" style="margin-bottom: 18px;">
                    <h3>Personal Information</h3>
                </div>

                <div class="field">
                    <label for="profUsername">System Username (read-only)</label>
                    <input type="text" id="profUsername" readonly style="background-color: var(--mint-100); cursor: not-allowed; font-weight: 700; color: var(--text-muted);">
                </div>
                <div class="field">
                    <label for="profFullName">Full Display Name *</label>
                    <input type="text" id="profFullName" placeholder="e.g. Saman Perera" required>
                </div>

                <div class="form-card-head" style="margin: 10px 0 18px 0;">
                    <h3>Security</h3>
                </div>

                <div class="field">
                    <label for="profCurrentPass">Current Password</label>
                    <input type="password" id="profCurrentPass" placeholder="Enter current password">
                </div>
                <div class="field">
                    <label for="profNewPass">New Password (optional)</label>
                    <input type="password" id="profNewPass" placeholder="Enter new password">
                </div>

                <button type="submit" class="btn-primary-flat">Save Profile Changes</button>
            </form>
        </div>
    </div>
</div>
