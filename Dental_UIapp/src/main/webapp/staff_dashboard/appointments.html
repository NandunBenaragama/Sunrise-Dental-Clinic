<div class="tab-content" id="appointments">

    <div class="data-panel">
        <div class="data-panel-head">
            <div>
                <h3>Appointment Schedule</h3>
                <p>Every booking across the clinic, editable in one place.</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchApptInput" placeholder="Search bookings" onkeyup="filterTable('apptTable', 'searchApptInput')">
            </div>
        </div>

        <div class="data-panel-table-wrap">
            <table id="apptTable">
                <thead>
                    <tr>
                        <th>Appt No.</th>
                        <th>Patient</th>
                        <th>Contact</th>
                        <th>Dentist</th>
                        <th>Treatment</th>
                        <th>Date &amp; Time</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="apptTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading appointments...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Appointment Drawer -->
<div id="editAppointmentModal" class="drawer-overlay">
    <div class="drawer-panel">
        <div class="drawer-header">
            <div>
                <span class="drawer-eyebrow">Booking</span>
                <h3><i class="fa-solid fa-calendar-pen"></i> Edit Appointment Booking</h3>
            </div>
            <button type="button" class="drawer-close" onclick="closeEditAppointmentModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form onsubmit="handleUpdateAppointment(event)" class="drawer-body">
            <input type="hidden" id="editApptNo">

            <div class="input-group">
                <label>Assigned Dentist *</label>
                <select id="editApptDoctor" required></select>
            </div>

            <div class="input-group">
                <label>Treatment Type *</label>
                <select id="editApptTreatment" required></select>
            </div>

            <div class="input-group">
                <label>Appointment Date & Time *</label>
                <input type="datetime-local" id="editApptDateTime" required>
            </div>

            <div class="input-group">
                <label>Appointment Status *</label>
                <select id="editApptStatus">
                    <option value="Pending">Pending</option>
                    <option value="Done">Done</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <div class="drawer-footer">
                <button type="button" class="btn-cancel" onclick="closeEditAppointmentModal()">Cancel</button>
                <button type="submit" class="btn-save"><i class="fa-solid fa-check"></i> Save Changes</button>
            </div>
        </form>
    </div>
</div>
