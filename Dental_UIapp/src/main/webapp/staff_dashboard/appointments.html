<div class="tab-content" id="appointments">
    <div class="card">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <h3><i class="fa-solid fa-list-check" style="color:var(--primary);"></i> Patient Appointment Schedule & Care Tracking</h3>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchApptInput" placeholder="Search Bookings..." onkeyup="filterTable('apptTable', 'searchApptInput')">
            </div>
        </div>

        <div class="table-responsive">
            <table class="data-table" id="apptTable">
                <thead>
                    <tr>
                        <th>Appt No.</th>
                        <th>Patient Name</th>
                        <th>Contact</th>
                        <th>Assigned Dentist</th>
                        <th>Treatment</th>
                        <th>Date & Time</th>
                        <th>Status</th>
                        <th style="text-align: center;">Actions</th>
                    </tr>
                </thead>
                <tbody id="apptTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 20px;">Loading appointments...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Edit Appointment Modal Popup -->
<div id="editAppointmentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 99999; justify-content: center; align-items: center;">
    <div style="background: #ffffff; width: 480px; max-width: 90%; padding: 28px; border-radius: 18px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35); border: 1px solid #e2e8f0; animation: modalFadeIn 0.3s ease;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
            <h3 style="color: #0f172a; font-size: 18px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px;">
                <i class="fa-solid fa-calendar-pen" style="color: #0284c7;"></i> Edit Appointment Booking
            </h3>
            <button type="button" onclick="closeEditAppointmentModal()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #94a3b8; line-height: 1;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#94a3b8'">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form onsubmit="handleUpdateAppointment(event)">
            <input type="hidden" id="editApptNo">

            <div class="input-group" style="margin-bottom: 14px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Assigned Dentist *</label>
                <select id="editApptDoctor" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;" required></select>
            </div>

            <div class="input-group" style="margin-bottom: 14px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Treatment Type *</label>
                <select id="editApptTreatment" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;" required></select>
            </div>

            <div class="input-group" style="margin-bottom: 14px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Appointment Date & Time *</label>
                <input type="datetime-local" id="editApptDateTime" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;" required>
            </div>

            <div class="input-group" style="margin-bottom: 22px; text-align: left;">
                <label style="font-size: 12.5px; font-weight: 700; color: #334155; display: block; margin-bottom: 5px;">Appointment Status *</label>
                <select id="editApptStatus" style="width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; box-sizing: border-box;">
                    <option value="Pending">Pending</option>
                    <option value="Done">Done</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" onclick="closeEditAppointmentModal()" style="padding: 10px 18px; border-radius: 10px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; font-weight: 600; font-size: 13.5px; cursor: pointer;">
                    Cancel
                </button>
                <button type="submit" style="padding: 10px 20px; border-radius: 10px; border: none; background: #0284c7; color: #ffffff; font-weight: 700; font-size: 13.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);">
                    <i class="fa-solid fa-check"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
