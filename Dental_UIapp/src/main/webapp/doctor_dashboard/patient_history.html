<div id="patient-history-tab" class="tab-content">

    <div class="data-panel">
        <div class="data-panel-head">
            <div>
                <h3>Patient History</h3>
                <p>A running record of every patient you've treated.</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="patientHistorySearch" onkeyup="filterTable('patientHistoryTable', 'patientHistorySearch')" placeholder="Search patient name or ID">
            </div>
        </div>

        <div class="data-panel-table-wrap">
        <table id="patientHistoryTable">
            <thead>
                <tr>
                    <th>Patient ID</th>
                    <th>Patient</th>
                    <th>Contact</th>
                    <th>Appt No.</th>
                    <th>Treatment</th>
                    <th>Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="patientHistoryBody">
                <tr><td colspan="7" style="text-align:center;">Loading patient history...</td></tr>
            </tbody>
        </table>
        </div>
    </div>
</div>
